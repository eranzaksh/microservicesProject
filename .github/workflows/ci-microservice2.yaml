name: Microservice2 CI Lint with Pylint, Build & Push to Docker Hub

on:
  push:
    branches: [ main ]
    paths:
      - 'microservice2/**' 

jobs:
  lint:
    name: Lint Python Code with Pylint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'       

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r microservice2/requirements.txt
          pip install pylint

      - name: Run Pylint
        run: |
          pylint --fail-under=5 microservice2/            

  build-and-push:
    name: Build & Push Docker Image
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./microservice2
          file:    ./microservice2/Dockerfile
          push:    true
          tags: |
            your-user/microservice2:latest
            your-user/microservice2:${{ github.sha }}