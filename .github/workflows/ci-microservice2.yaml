name: Microservice2 CI Build & Push to Docker Hub

on:
  push:
    branches: [ main ]
    paths:
      - 'microservice2/**'    # change to microservice2/** in the other workflow

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # 3) Build & push
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./microservice2
          file:    ./microservice2/Dockerfile
          push:    true
          tags:    eranzaksh/microservice2:latest, eranzaksh/microservice2:${{ github.sha }}